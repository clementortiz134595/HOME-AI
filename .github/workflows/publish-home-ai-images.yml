name: Publish Home AI images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-home-ai-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Home Core
        uses: docker/build-push-action@v6
        with:
          context: poles/technique/home-core
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/home-core:${{ env.RELEASE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/home-core:latest
          cache-from: type=gha,scope=home-core
          cache-to: type=gha,mode=max,scope=home-core
      - name: Build and publish Home Panel
        uses: docker/build-push-action@v6
        with:
          context: poles/technique/home-panel
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/home-panel:${{ env.RELEASE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/home-panel:latest
          cache-from: type=gha,scope=home-panel
          cache-to: type=gha,mode=max,scope=home-panel
      - name: Build and publish Home App
        uses: docker/build-push-action@v6
        with:
          context: poles/technique/home-app
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/home-app:${{ env.RELEASE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/home-app:latest
          cache-from: type=gha,scope=home-app
          cache-to: type=gha,mode=max,scope=home-app
