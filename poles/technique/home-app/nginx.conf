server {
  listen 80;
  server_name _;
  location = /home-app-rootCA.pem {
    alias /etc/nginx/certs/home-app-rootCA.pem;
    default_type application/x-pem-file;
    add_header Content-Disposition 'attachment; filename="home-app-rootCA.pem"';
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/home-app.pem;
  ssl_certificate_key /etc/nginx/certs/home-app-key.pem;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /v1/ {
    client_body_buffer_size 16k;
    proxy_pass http://home-core:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
