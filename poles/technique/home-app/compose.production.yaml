name: home-app
services:
  app:
    image: ${HOME_AI_HOME_APP_IMAGE:-home-app:local}
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:${HOME_APP_TLS_PORT:-13444}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - home-ai
networks:
  home-ai:
    external: true
