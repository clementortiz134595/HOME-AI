name: home-app
services:
  app:
    image: ${HOME_AI_HOME_APP_IMAGE:-home-app:local}
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:${HOME_APP_TLS_PORT:-13444}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - home-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  home-ai:
    external: true
