# Do not start this file directly. Use the root panel+core stack:
#   docker compose -f /Users/clement/Desktop/code/home-ai/compose.yaml up -d --build
services:
  home-core:
    build:
      context: .
    image: home-ai/home-core:local
    environment:
      HOME_CORE_PORT: "8080"
      APPLE_CALDAV_ACCOUNTS_JSON: ${APPLE_CALDAV_ACCOUNTS_JSON:-}
      HOME_CORE_ZIGBEE_FIXTURE: /app/fixtures/maison-demo.json
      HOME_CORE_AI_BASE_URL: ${HOME_CORE_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      HOME_CORE_AI_API_KEY: ${HOME_CORE_AI_API_KEY:-}
      HOME_CORE_AI_MODEL: ${HOME_CORE_AI_MODEL:-gemini-2.5-flash-native-audio-preview-12-2025}
      HOME_CORE_STT_BASE_URL: ${HOME_CORE_STT_BASE_URL:-https://speech.googleapis.com/v2/projects}
      HOME_CORE_STT_API_KEY: ${HOME_CORE_STT_API_KEY:-}
      HOME_CORE_STT_PROJECT: ${HOME_CORE_STT_PROJECT:-}
      HOME_CORE_STT_LOCATION: ${HOME_CORE_STT_LOCATION:-eu}
      HOME_CORE_STT_LANGUAGE: ${HOME_CORE_STT_LANGUAGE:-fr-FR}
      HOME_CORE_WAKE_MODEL_DIR: ${HOME_CORE_WAKE_MODEL_DIR:-/app/models/sherpa-kws}
      HOME_CORE_GMAIL_CLIENT_ID: ${HOME_CORE_GMAIL_CLIENT_ID:-}
      HOME_CORE_GMAIL_CLIENT_SECRET: ${HOME_CORE_GMAIL_CLIENT_SECRET:-}
      HOME_CORE_GMAIL_REDIRECT_URL: ${HOME_CORE_GMAIL_REDIRECT_URL:-http://localhost:8080/v1/workspace/google/gmail/oauth/callback}
      HOME_CORE_GMAIL_TOKEN_PATH: ${HOME_CORE_GMAIL_TOKEN_PATH:-/var/lib/home-core/gmail-token.json}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../zigbee-simulator/code/fixtures:/app/fixtures:ro
      - home-core-secrets:/var/lib/home-core
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  home-core-secrets:
