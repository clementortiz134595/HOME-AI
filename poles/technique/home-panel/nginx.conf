server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # PDF.js loads its renderer as an ES module. The stock Alpine MIME table
  # does not map .mjs, so Chrome otherwise refuses to start the worker.
  location ~ \.mjs$ {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location /v1/ {
    client_body_buffer_size 16k;
    proxy_pass http://home-core:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
