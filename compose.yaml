name: home-ai

services:
  home-core-secrets-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/home-core && chown 999:999 /var/lib/home-core && chmod 700 /var/lib/home-core"]
    volumes:
      - home-core-secrets:/var/lib/home-core
    restart: "no"

  home-core:
    build:
      context: ./poles/technique/home-core
    image: home-ai/home-core:local
    depends_on:
      home-core-secrets-init:
        condition: service_completed_successfully
    env_file:
      - path: ${HOME_AI_SECRETS_FILE:-/Users/clement/.config/home-ai/home-core.env}
        required: false
    environment:
      HOME_CORE_PORT: "8080"
      HOME_CORE_ZIGBEE_FIXTURE: /app/fixtures/maison-demo.json
      HOME_CORE_WAKE_MODEL_DIR: /app/models/sherpa-kws
      HOME_CORE_AI_BASE_URL: ${HOME_CORE_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      HOME_CORE_AI_MODEL: ${HOME_CORE_AI_MODEL:-gemini-3.8-flash}
      HOME_CORE_STT_BASE_URL: ${HOME_CORE_STT_BASE_URL:-https://eu-speech.googleapis.com/v2/projects}
      HOME_CORE_STT_PROJECT: ${HOME_CORE_STT_PROJECT:-home-ai-513620}
      HOME_CORE_STT_LOCATION: ${HOME_CORE_STT_LOCATION:-eu}
      HOME_CORE_STT_LANGUAGE: ${HOME_CORE_STT_LANGUAGE:-fr-FR}
      HOME_CORE_GMAIL_TOKEN_PATH: /var/lib/home-core/gmail-token.json
      HOME_CORE_DATABASE_PATH: /var/lib/home-core/home-core.sqlite
      APPLE_CALDAV_ACCOUNTS_JSON: ${APPLE_CALDAV_ACCOUNTS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-adc.json
      HOME_CORE_SNCF_BASE_URL: ${HOME_CORE_SNCF_BASE_URL:-https://api.trainnomade.fr}
      HOME_CORE_SNCF_STOP_AREA: ${HOME_CORE_SNCF_STOP_AREA:-87751784}
      HOME_CORE_EODHD_BASE_URL: ${HOME_CORE_EODHD_BASE_URL:-https://eodhd.com/api}
      HOME_CORE_EODHD_API_KEY: ${HOME_CORE_EODHD_API_KEY:-}
    volumes:
      - ./poles/technique/zigbee-simulator/code/fixtures:/app/fixtures:ro
      - ${HOME_AI_GOOGLE_ADC_FILE:-/Users/clement/.config/gcloud/application_default_credentials.json}:/run/secrets/google-adc.json:ro
      - home-core-secrets:/var/lib/home-core
    ports:
      - "127.0.0.1:18080:8080"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  home-panel:
    build:
      context: ./poles/technique/home-panel
      target: production
    image: home-ai/home-panel:local
    ports:
      - "${HOME_PANEL_PORT:-3000}:80"
    depends_on:
      home-core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  home-core-secrets:
